name: CI

# Pull requests run the checks whose inputs changed. Each job decides that in its own
# first step (.github/actions/affected), so no check waits on another. Pushes to main,
# merge-queue groups and release validation run every check. Changes to workflows, local
# actions, go.mod or go.sum rerun everything. Add "CI passed" to branch protection,
# retaining existing checks.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable source commit to validate for a release retry
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  site:
    name: Check site and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - id: affected
        uses: ./.github/actions/affected
        with:
          paths: |
            site
            docs
            demo
            README.md
            internal/scan/builtin.go
            .github/workflows
            .github/actions
            go.mod
            go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.affected.outputs.run == 'true'
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        if: steps.affected.outputs.run == 'true'
        working-directory: site
        run: npm ci
      - name: Check and build Astro site
        if: steps.affected.outputs.run == 'true'
        working-directory: site
        run: |
          npm run check
          npm run format:check
          npm run build
      - name: Smoke test built site
        if: steps.affected.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory site/dist >/tmp/repyy-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for site_path in index.html docs/ installation/ cli/ configuration/ isolation/ coverage/ intelligence/ agent-skill/ trust/ verification/ demo/ security-testing/ changelog/ about/ search-index.json demo/sample/sample.html demo/sample/sample.json demo/sample/sample.txt demo/sample/results.json demo/sample/results.md; do
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 "http://127.0.0.1:4173/$site_path" >/dev/null
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/ --output /tmp/repyy-root.html
          curl --fail --silent --show-error http://127.0.0.1:4173/index.html --output /tmp/repyy-index.html
          curl --fail --silent --show-error http://127.0.0.1:4173/docs/ --output /tmp/repyy-docs.html
          grep --quiet '<title>repyy · ' /tmp/repyy-root.html
          grep --quiet '<title>repyy · ' /tmp/repyy-index.html
          grep --quiet '<title>repyy documentation</title>' /tmp/repyy-docs.html
          python3 site/check_docs.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - id: affected
        uses: ./.github/actions/affected
        with:
          paths: |
            :(glob)**/*.go
            Makefile
            .github/workflows
            .github/actions
            go.mod
            go.sum
      - uses: ./.github/actions/setup-go
        if: steps.affected.outputs.run == 'true'
        with:
          job: test
      - if: steps.affected.outputs.run == 'true'
        run: go test -race -shuffle=on -count=1 ./...

  # Small checks share one job. Every step runs even after another fails, so a red run
  # lists every failure at once.
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - id: go
        uses: ./.github/actions/affected
        with:
          paths: |
            :(glob)**/*.go
            Makefile
            .github/workflows
            .github/actions
            go.mod
            go.sum
      - uses: ./.github/actions/setup-go
        with:
          job: lint
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test release helpers
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check Go formatting
        if: ${{ !cancelled() && steps.go.outputs.run == 'true' }}
        run: test -z "$(gofmt -l .)"
      - name: Vet
        if: ${{ !cancelled() && steps.go.outputs.run == 'true' }}
        run: go vet ./...

  # Branch protection requires vulnerability-scan and release-config by name, so they
  # stay separate jobs.
  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - id: affected
        uses: ./.github/actions/affected
        with:
          paths: |
            :(glob)**/*.go
            Makefile
            .github/workflows
            .github/actions
            go.mod
            go.sum
      - uses: ./.github/actions/setup-go
        if: steps.affected.outputs.run == 'true'
        with:
          job: vulnerability-scan
      - if: steps.affected.outputs.run == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: affected
        uses: ./.github/actions/affected
        with:
          paths: |
            Makefile
            site/CHANGELOG.md
            scripts
            .goreleaser.yaml
            Dockerfile.sandbox
            .dockerignore
            .github/workflows
            .github/actions
            go.mod
            go.sum
      - uses: ./.github/actions/setup-go
        if: steps.affected.outputs.run == 'true'
        with:
          job: release-config
      - if: steps.affected.outputs.run == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.18.0"
          args: check

  # The check names stay build (<os>) because branch protection requires them. macOS
  # runs on the Intel pool: jobs on GitHub's arm64 macOS pool waited 15 minutes and were
  # cancelled four times on 2026-11-25. Release builds still cross-compile darwin/arm64.
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: macos-latest
            runner: macos-15-intel
    runs-on: ${{ matrix.runner || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - id: affected
        uses: ./.github/actions/affected
        with:
          paths: |
            :(glob)**/*.go
            Makefile
            scripts
            demo
            keys
            test
            .github/workflows
            .github/actions
            go.mod
            go.sum
      - uses: ./.github/actions/setup-go
        if: steps.affected.outputs.run == 'true'
        with:
          job: build
      - name: Build and run CLI
        if: steps.affected.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          go build -o "$RUNNER_TEMP/repyy$suffix" ./cmd/repyy
          "$RUNNER_TEMP/repyy$suffix" version
      - name: Check detection benchmark and intelligence export
        if: runner.os == 'Linux' && steps.affected.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/benchmark.py --binary "$RUNNER_TEMP/repyy" --output "$RUNNER_TEMP/benchmark" --check
          test "$("$RUNNER_TEMP/repyy" intel export | wc -c)" -le $((16 * 1024 * 1024))
      - name: Save benchmark results
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ inputs.source_ref || github.sha }}
          path: ${{ runner.temp }}/benchmark
          if-no-files-found: ignore

  sandbox-image:
    name: Check sandbox image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - id: affected
        uses: ./.github/actions/affected
        with:
          paths: |
            Dockerfile.sandbox
            .dockerignore
            :(glob)**/*.go
            .github/workflows
            .github/actions
            go.mod
            go.sum
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.affected.outputs.run == 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.affected.outputs.run == 'true'
        with:
          context: .
          file: Dockerfile.sandbox
          build-args: VERSION=ci
          tags: repyy-sandbox:ci
          load: true
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - if: steps.affected.outputs.run == 'true'
        run: docker run --rm --network none repyy-sandbox:ci version

  fuzz:
    name: Fuzz smoke checks
    uses: ./.github/workflows/fuzz.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}

  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - id: affected
        uses: ./.github/actions/affected
        with:
          paths: |
            :(glob)**/*.go
            Makefile
            site/CHANGELOG.md
            scripts
            .goreleaser.yaml
            Dockerfile.sandbox
            .dockerignore
            .github/workflows
            .github/actions
            go.mod
            go.sum
      - uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        if: steps.affected.outputs.run == 'true'
        with:
          languages: go
      - uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        if: steps.affected.outputs.run == 'true'
        with:
          category: /language:go

  analyze-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - id: affected
        uses: ./.github/actions/affected
        with:
          paths: |
            :(glob)**/*.go
            Makefile
            site/CHANGELOG.md
            scripts
            .goreleaser.yaml
            Dockerfile.sandbox
            .dockerignore
            .github/workflows
            .github/actions
            go.mod
            go.sum
      - uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        if: steps.affected.outputs.run == 'true'
        with:
          languages: actions
      - uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        if: steps.affected.outputs.run == 'true'
        with:
          category: /language:actions

  passed:
    name: CI passed
    needs: [site, test, lint, vulnerability-scan, build, sandbox-image, release-config, fuzz, analyze, analyze-actions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Checks did not pass: ' + ', '.join(failed))
          print('All applicable validation and security checks passed.')
          PY
