name: Fuzz

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      extended:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: scan
            targets: FuzzArchiveInspection FuzzArchivePaths FuzzGitMetadata FuzzSymlinkConfinement
          - package: config
            targets: FuzzConfiguration
          - package: manifest
            targets: FuzzManifests
          - package: output
            targets: FuzzHumanOutput FuzzJSONReports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Set Go cache paths
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore fuzz compilation and corpus cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
          key: fuzz-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.package }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.package }}-${{ hashFiles('go.sum') }}-
      - name: Fuzz hostile inputs with a fixed execution budget
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_TARGETS: ${{ matrix.targets }}
          EXTENDED: ${{ inputs.extended }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fuzz-logs"
          failed=0
          for target in $FUZZ_TARGETS; do
            case "$target" in
              FuzzHumanOutput) executions=2500 ;;
              FuzzGitMetadata|FuzzSymlinkConfinement) executions=5000 ;;
              FuzzConfiguration) executions=10000 ;;
              *) executions=50000 ;;
            esac
            if [[ "$EXTENDED" == true ]]; then executions=$((executions * 10)); fi
            if ! go test "./internal/$FUZZ_PACKAGE" -run '^$' -fuzz "^${target}$" -fuzztime "${executions}x" -parallel 2 2>&1 | tee "$RUNNER_TEMP/fuzz-logs/$target.log"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Preserve fuzz logs and failing inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.package }}-${{ inputs.source_ref }}
          path: |
            ${{ runner.temp }}/fuzz-logs
            internal/**/testdata/fuzz/**
          retention-days: 14
