name: Prepare release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prepare-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    name: Start release after successful main validation
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch a new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$VALIDATED_SHA" != "$current_sha" || "$GITHUB_SHA" != "$current_sha" ]]; then
            echo 'A newer main commit will prepare its own release.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version="$(sed -nE 's/^VERSION \?= ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Makefile)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2> "$RUNNER_TEMP/tag-error"; then
            echo "$tag already exists. Use Release on main with tag=$tag to retry it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif ! grep -q '(HTTP 404)' "$RUNNER_TEMP/tag-error"; then
            cat "$RUNNER_TEMP/tag-error" >&2
            exit 1
          fi
          gh workflow run release.yml --ref main
          echo "Started release preparation for $tag. Validation and signing must pass before tagging." >> "$GITHUB_STEP_SUMMARY"
