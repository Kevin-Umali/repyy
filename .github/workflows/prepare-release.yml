name: Prepare release

on:
  workflow_dispatch:

concurrency:
  group: prepare-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Tag current main version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for successful main CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          passed=false
          for _ in $(seq 1 120); do
            run_state="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main -f event=push -f head_sha="$RELEASE_SHA" -f per_page=10 \
              --jq '.workflow_runs | sort_by(.created_at) | last | if . == null then "missing|none|none" else "\(.status)|\(.conclusion // "none")|\(.html_url)" end')"
            IFS='|' read -r status conclusion run_url <<<"$run_state"
            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" != success ]]; then
                echo "Main CI did not pass for $RELEASE_SHA: $conclusion ($run_url)" >&2
                exit 1
              fi
              echo "Main CI passed for $RELEASE_SHA: $run_url" >> "$GITHUB_STEP_SUMMARY"
              passed=true
              break
            fi
            sleep 10
          done
          if [[ "$passed" != true ]]; then
            echo "Timed out waiting for main CI on $RELEASE_SHA" >&2
            exit 1
          fi
      - name: Tag and dispatch release for a new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$RELEASE_SHA" != "$current_sha" ]]; then
            echo 'A newer main commit is available; run this workflow again on main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          version="$(sed -nE 's/^VERSION \?= ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Makefile)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          tag="v$version"
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; no release was created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          latest="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -n 1)" != "$tag" ]]; then
            echo "$tag must be newer than $latest" >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$RELEASE_SHA" >/dev/null
          gh workflow run release.yml --ref "$tag"
          echo "Created $tag from $RELEASE_SHA and started the release workflow." >> "$GITHUB_STEP_SUMMARY"
