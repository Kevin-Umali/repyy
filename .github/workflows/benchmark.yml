name: Benchmark

# Fixture recall, benign controls, and high findings on clean repositories pinned in
# scripts/hard_benchmark/corpus.json. Fails when a control raises a high finding, recall
# falls below 58 fixtures, or the clean corpus exceeds its max_high budget.
# Malware samples are never downloaded here.

on:
  pull_request:
    paths:
      - internal/scan/**
      - internal/intel/**
      - internal/manifest/**
      - scripts/hard_benchmark/**
      - .github/workflows/benchmark.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  noise:
    name: Recall and noise
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run the pinned benchmark
        run: make bench
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: .bench/results.json
          retention-days: 30
