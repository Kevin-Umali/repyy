name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify release source
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Create and verify signed intelligence snapshot
        env:
          REPYY_INTEL_SIGNING_KEY: ${{ secrets.REPYY_INTEL_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$REPYY_INTEL_SIGNING_KEY"
          key="$RUNNER_TEMP/repyy-intelligence.pem"
          snapshot="$RUNNER_TEMP/repyy-intelligence.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$REPYY_INTEL_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          go run ./cmd/repyy intel export > "$snapshot"
          openssl pkeyutl -sign -rawin \
            -inkey "$key" \
            -in "$snapshot" \
            -out "$snapshot.sig"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey keys/intelligence-ed25519.pem \
            -in "$snapshot" \
            -sigfile "$snapshot.sig"
          rm -f "$key"
          trap - EXIT
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.18.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT limited to contents:write on the tap and bucket.
          REPYY_RELEASE_TOKEN: ${{ secrets.REPYY_RELEASE_TOKEN }}
      - name: Smoke-test released binary
        run: |
          set -euo pipefail
          binary=""
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q 'ELF 64-bit.*x86-64'; then
              binary="$candidate"
              break
            fi
          done < <(find dist -type f -name repyy -perm -111)
          test -n "$binary"
          "$binary" version
          REPYY_CACHE_DIR="$RUNNER_TEMP/repyy-cache" "$binary" intel status --format json
      - name: Attach signed intelligence snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/repyy-intelligence.json" "$RUNNER_TEMP/repyy-intelligence.json.sig" --clobber
