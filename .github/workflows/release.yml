name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify release source
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(sed -nE 's/^VERSION \?= ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Makefile)"
          test "$GITHUB_REF_NAME" = "v$version"
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and sign sandbox image
        env:
          IMAGE: ghcr.io/kevin-umali/repyy-sandbox
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$version" \
            --tag "$IMAGE:$GITHUB_REF_NAME" \
            --metadata-file "$RUNNER_TEMP/repyy-sandbox-image.json" \
            --file Dockerfile.sandbox \
            --push .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/repyy-sandbox-image.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$IMAGE@$digest"
          cosign verify "$IMAGE@$digest" \
            --certificate-identity "https://github.com/Kevin-Umali/repyy/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          printf '%s\n' "$IMAGE@$digest" > "$RUNNER_TEMP/repyy-sandbox-image.txt"
          echo "REPYY_SANDBOX_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          docker pull "$IMAGE@$digest"
          docker run --rm --network none "$IMAGE@$digest" version
      - name: Create and verify signed intelligence snapshot
        env:
          REPYY_INTEL_SIGNING_KEY: ${{ secrets.REPYY_INTEL_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$REPYY_INTEL_SIGNING_KEY"
          key="$RUNNER_TEMP/repyy-intelligence.pem"
          snapshot="$RUNNER_TEMP/repyy-intelligence.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$REPYY_INTEL_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          go run ./cmd/repyy intel export > "$snapshot"
          openssl pkeyutl -sign -rawin \
            -inkey "$key" \
            -in "$snapshot" \
            -out "$snapshot.sig"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey keys/intelligence-ed25519.pem \
            -in "$snapshot" \
            -sigfile "$snapshot.sig"
          rm -f "$key"
          trap - EXIT
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.18.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT limited to contents:write on the tap and bucket.
          REPYY_RELEASE_TOKEN: ${{ secrets.REPYY_RELEASE_TOKEN }}
      - name: Smoke-test released binary
        run: |
          set -euo pipefail
          binary=""
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q 'ELF 64-bit.*x86-64'; then
              binary="$candidate"
              break
            fi
          done < <(find dist -type f -name repyy -perm -111)
          test -n "$binary"
          "$binary" version
          REPYY_CACHE_DIR="$RUNNER_TEMP/repyy-cache" "$binary" intel status --format json
      - name: Attach signed intelligence snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/repyy-intelligence.json" "$RUNNER_TEMP/repyy-intelligence.json.sig" "$RUNNER_TEMP/repyy-sandbox-image.txt" --clobber
      - name: Summarize release
        if: success()
        run: |
          echo "### Published $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "[Release and assets](https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"
