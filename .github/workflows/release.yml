name: Release

# Run on main so workflow fixes can release an existing immutable tag.
# Failed jobs reuse the saved build. Set resume_run_id when using a repaired workflow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to retry; leave empty to release the current main version
        type: string
      resume_run_id:
        description: Original release run containing the saved build bundle
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      exists: ${{ steps.source.outputs.exists }}
      validated: ${{ steps.validation.outputs.validated }}
      resume_run_id: ${{ steps.resume.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the version and original source commit
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^VERSION \?= ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Makefile)"
          tag="${REQUESTED_TAG:-v$version}"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          exists=false
          sha="$GITHUB_SHA"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            exists=true
            sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          else
            test -z "$REQUESTED_TAG"
            latest="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
            test -z "$latest" || test "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -n 1)" = "$tag"
          fi
          git merge-base --is-ancestor "$sha" origin/main
          source_version="$(git show "$sha:Makefile" | sed -nE 's/^VERSION \?= ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')"
          test "$tag" = "v$source_version"
          git show "$sha:CHANGELOG.md" | grep -Eq "^## \[${source_version}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$"
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "exists=$exists"
          } >> "$GITHUB_OUTPUT"
          printf '### %s\nSource: `%s`\n' "$tag" "$sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Require main CI and check whether source validation can be reused
        id: validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$(python3 scripts/release.py ci "$GITHUB_SHA")" != true ]]; then
            echo 'Wait for this main commit to pass CI before publishing.' >&2
            exit 1
          fi
          validated=true
          if [[ "$SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            validated="$(python3 scripts/release.py ci "$SOURCE_SHA")"
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"
          echo "Reusing source CI: $validated" >> "$GITHUB_STEP_SUMMARY"
      - name: Select the original build for a retry
        id: resume
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          resume="$RESUME_RUN_ID"
          if [[ -z "$resume" ]]; then
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq ".artifacts | map(select(.name == \"release-$RELEASE_TAG\" and .expired == false)) | length")"
            if [[ "$count" == 1 ]]; then resume="$GITHUB_RUN_ID"; fi
          fi
          if [[ -n "$resume" ]]; then
            [[ "$resume" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$resume" > "$RUNNER_TEMP/resume-run.json"
            jq -e --arg repo "$GITHUB_REPOSITORY" '.path == ".github/workflows/release.yml" and .head_branch == "main" and .event == "workflow_dispatch" and .head_repository.full_name == $repo' "$RUNNER_TEMP/resume-run.json"
            git merge-base --is-ancestor "$(jq -r .head_sha "$RUNNER_TEMP/resume-run.json")" origin/main
          fi
          echo "run_id=$resume" >> "$GITHUB_OUTPUT"
      - name: Refuse to rebuild a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RESUME_RUN_ID: ${{ steps.resume.outputs.run_id }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release-error"; then
            if jq -e '.draft == false' "$RUNNER_TEMP/release.json" >/dev/null && [[ -z "$RESUME_RUN_ID" ]]; then
              echo 'Supply resume_run_id to reuse the published files. They cannot be rebuilt.' >&2
              exit 1
            fi
          elif ! grep -q '(HTTP 404)' "$RUNNER_TEMP/release-error"; then
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi

  validate:
    name: Validate source when no complete CI result exists
    needs: resolve
    if: needs.resolve.outputs.validated != 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.resolve.outputs.sha }}

  prepare:
    name: Check signing and prepare immutable tag
    needs: [resolve, validate]
    if: >-
      !cancelled() && needs.resolve.result == 'success'
      && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"
      - name: Exercise signing before creating a tag
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_TAG $SOURCE_SHA" > "$RUNNER_TEMP/signing-check.txt"
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/signing-check.sigstore.json" "$RUNNER_TEMP/signing-check.txt"
          cosign verify-blob --bundle "$RUNNER_TEMP/signing-check.sigstore.json" "$RUNNER_TEMP/signing-check.txt" --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Create a new tag or confirm the existing source
        env:
          TAG_EXISTS: ${{ needs.resolve.outputs.exists }}
        run: |
          set -euo pipefail
          if [[ "$TAG_EXISTS" == false ]]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA" >/dev/null
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_SHA"

  build:
    name: Build and save release artifacts
    needs: [resolve, prepare]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    defaults:
      run:
        working-directory: source
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      GORELEASER_CURRENT_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the original build for a retry
        if: needs.resolve.outputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RUN_ID: ${{ needs.resolve.outputs.resume_run_id }}
        run: |
          set -euo pipefail
          gh run download "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-$RELEASE_TAG" --dir "$RUNNER_TEMP/saved-release"
          tar -xf "$RUNNER_TEMP/saved-release/release-bundle.tar"
          cp "$RUNNER_TEMP/saved-release/release-bundle.tar" "$RUNNER_TEMP/release-bundle.tar"
          python3 ../controller/scripts/release.py validate "$RELEASE_TAG" "$SOURCE_SHA" public
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.resolve.outputs.resume_run_id == ''
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
          cache: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs.resolve.outputs.resume_run_id == ''
        with:
          cosign-release: "v3.0.6"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: needs.resolve.outputs.resume_run_id == ''
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: needs.resolve.outputs.resume_run_id == ''
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: needs.resolve.outputs.resume_run_id == ''
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: needs.resolve.outputs.resume_run_id == ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the source build date
        if: needs.resolve.outputs.resume_run_id == ''
        id: image_metadata
        run: |
          echo "date=$(git show -s --format=%cI "$SOURCE_SHA")" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build the multi-platform sandbox image
        if: needs.resolve.outputs.resume_run_id == ''
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          file: source/Dockerfile.sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kevin-umali/repyy-sandbox:${{ env.RELEASE_TAG }}
          build-args: |
            VERSION=${{ steps.image_metadata.outputs.version }}
            COMMIT=${{ env.SOURCE_SHA }}
            BUILD_DATE=${{ steps.image_metadata.outputs.date }}
            BUILT_BY=GitHub Actions
          cache-from: type=gha,scope=release-sandbox
          cache-to: type=gha,mode=max,scope=release-sandbox
      - name: Sign and smoke-test the sandbox image
        if: needs.resolve.outputs.resume_run_id == ''
        env:
          IMAGE: ghcr.io/kevin-umali/repyy-sandbox
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com
          printf '%s\n' "$IMAGE@$DIGEST" > "$RUNNER_TEMP/repyy-sandbox-image.txt"
          echo "REPYY_SANDBOX_IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          docker pull "$IMAGE@$DIGEST"
          docker run --rm --network none "$IMAGE@$DIGEST" version
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: needs.resolve.outputs.resume_run_id == ''
        with:
          distribution: goreleaser
          version: "v2.18.0"
          args: release --clean --skip=publish --config ../controller/.goreleaser.yaml
          workdir: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test released binary
        if: needs.resolve.outputs.resume_run_id == ''
        run: |
          set -euo pipefail
          binary=""
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q 'ELF 64-bit.*x86-64'; then
              binary="$candidate"
              break
            fi
          done < <(find dist -type f -name repyy -perm -111)
          test -n "$binary"
          "$binary" version
          REPYY_CACHE_DIR="$RUNNER_TEMP/repyy-cache" "$binary" intel status --format json
      - name: Create and verify signed intelligence snapshot
        if: needs.resolve.outputs.resume_run_id == ''
        env:
          REPYY_INTEL_SIGNING_KEY: ${{ secrets.REPYY_INTEL_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$REPYY_INTEL_SIGNING_KEY"
          key="$RUNNER_TEMP/repyy-intelligence.pem"
          snapshot="$RUNNER_TEMP/repyy-intelligence.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$REPYY_INTEL_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          dist/repyy_linux_amd64_v1/repyy intel export > "$snapshot"
          openssl pkeyutl -sign -rawin \
            -inkey "$key" \
            -in "$snapshot" \
            -out "$snapshot.sig"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey keys/intelligence-ed25519.pem \
            -in "$snapshot" \
            -sigfile "$snapshot.sig"
          rm -f "$key"
          trap - EXIT
      - name: Generate release-set SBOM and benchmark
        if: needs.resolve.outputs.resume_run_id == ''
        run: |
          set -euo pipefail
          syft dir:dist -o spdx-json="$RUNNER_TEMP/repyy-release.spdx.json"
          python3 scripts/benchmark.py \
            --binary dist/repyy_linux_amd64_v1/repyy \
            --output "$RUNNER_TEMP/benchmark" --check
          image=ghcr.io/kevin-umali/repyy-sandbox
          docker buildx imagetools inspect "$image@$REPYY_SANDBOX_IMAGE_DIGEST" --raw \
            > "$RUNNER_TEMP/repyy-image-index.json"
          for arch in amd64 arm64; do
            digest="$(jq -er --arg arch "$arch" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
              | if length == 1 then .[0].digest else error("expected one platform") end
            ' "$RUNNER_TEMP/repyy-image-index.json")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s\n' "$image@$digest" > "$RUNNER_TEMP/repyy-container-linux-$arch.txt"
            echo "REPYY_IMAGE_$arch=$digest" >> "$GITHUB_ENV"
            syft "registry:$image@$digest" \
              -o spdx-json="$RUNNER_TEMP/repyy-container-linux-$arch.spdx.json"
          done
      - name: Record the source and exact public files
        if: needs.resolve.outputs.resume_run_id == ''
        run: |
          set -euo pipefail
          mkdir public
          cp dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.apk dist/*.sbom.json dist/checksums.txt* public/
          cp "$RUNNER_TEMP/repyy-intelligence.json" "$RUNNER_TEMP/repyy-intelligence.json.sig" "$RUNNER_TEMP/repyy-sandbox-image.txt" "$RUNNER_TEMP/repyy-release.spdx.json" "$RUNNER_TEMP"/repyy-container-linux-*.spdx.json "$RUNNER_TEMP"/repyy-container-linux-*.txt "$RUNNER_TEMP/benchmark/results.json" "$RUNNER_TEMP/benchmark/results.md" public/
          cp dist/homebrew/Casks/repyy.rb public/repyy-homebrew.rb
          cp dist/scoop/repyy.json public/repyy-scoop.json
          python3 ../controller/scripts/release.py create "$RELEASE_TAG" "$SOURCE_SHA" "$GITHUB_SHA" public
          python3 - <<'PYNOTES'
          import os, pathlib
          version = os.environ['RELEASE_TAG'][1:]
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          section = changelog.split(f'## [{version}]', 1)[1].split('\n## [', 1)[0]
          notes = f'## [{version}]' + section.rstrip() + '\n\n'
          notes += f"Source commit: {os.environ['SOURCE_SHA']}\n\n"
          notes += f"Build workflow commit: {os.environ['GITHUB_SHA']}\n\n"
          notes += f"Verification guide: https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/main/docs/VERIFICATION.md\n"
          pathlib.Path('release-notes.md').write_text(notes)
          PYNOTES
          tar -cf "$RUNNER_TEMP/release-bundle.tar" dist public release-notes.md
      - name: Save the build checkpoint
        if: needs.resolve.outputs.resume_run_id != github.run_id
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: ${{ runner.temp }}/release-bundle.tar
          retention-days: 90
          if-no-files-found: error

  attest:
    name: Attest saved artifacts
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Restore the saved build
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-$RELEASE_TAG" --dir "$RUNNER_TEMP/saved-release"
          tar -xf "$RUNNER_TEMP/saved-release/release-bundle.tar"
          echo "IMAGE_DIGEST=$(sed 's/.*@//' public/repyy-sandbox-image.txt)" >> "$GITHUB_ENV"
          for arch in amd64 arm64; do
            echo "IMAGE_$arch=$(sed 's/.*@//' "public/repyy-container-linux-$arch.txt")" >> "$GITHUB_ENV"
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest public files and extracted binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            public/*
            dist/**/repyy
            dist/**/repyy.exe
      - name: Attest sandbox image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/kevin-umali/repyy-sandbox
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest Linux amd64 container SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/kevin-umali/repyy-sandbox
          subject-digest: ${{ env.IMAGE_amd64 }}
          sbom-path: public/repyy-container-linux-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest Linux arm64 container SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/kevin-umali/repyy-sandbox
          subject-digest: ${{ env.IMAGE_arm64 }}
          sbom-path: public/repyy-container-linux-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest release-set SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            public/*.tar.gz
            public/*.zip
            public/*.deb
            public/*.rpm
            public/*.apk
            dist/**/repyy
            dist/**/repyy.exe
          sbom-path: public/repyy-release.spdx.json

  publish:
    name: Verify downloads and publish
    needs: [resolve, attest]
    if: ${{ !cancelled() && needs.attest.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: read
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and validate the build checkpoint
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-$RELEASE_TAG" --dir "$RUNNER_TEMP/saved-release"
          tar -xf "$RUNNER_TEMP/saved-release/release-bundle.tar"
          python3 controller/scripts/release.py validate "$RELEASE_TAG" "$SOURCE_SHA" public
      - name: Upload missing assets and verify fresh downloads
        run: |
          set -euo pipefail
          python3 controller/scripts/release.py upload "$RELEASE_TAG" "$SOURCE_SHA" public
          bash controller/scripts/verify-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release-verification"
      - name: Publish the verified release
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]; then
            latest=true
            if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/latest.json" 2> "$RUNNER_TEMP/latest-error"; then
              current="$(jq -r .tag_name "$RUNNER_TEMP/latest.json")"
              if [[ "$(printf '%s\n%s\n' "$current" "$RELEASE_TAG" | sort -V | tail -n 1)" != "$RELEASE_TAG" ]]; then latest=false; fi
            elif ! grep -q '(HTTP 404)' "$RUNNER_TEMP/latest-error"; then
              cat "$RUNNER_TEMP/latest-error" >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --draft=false --latest="$latest"
          fi
          printf '### Published %s\n[Release and assets](https://github.com/%s/releases/tag/%s)\n' "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  packages:
    name: Update ${{ matrix.target }}
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [homebrew, scoop]
    concurrency:
      group: package-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - name: Restore the published manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-$RELEASE_TAG" --dir "$RUNNER_TEMP/saved-release"
          tar -xf "$RUNNER_TEMP/saved-release/release-bundle.tar"
          mkdir -p manifests/homebrew/Casks manifests/scoop
          cp public/repyy-homebrew.rb manifests/homebrew/Casks/repyy.rb
          cp public/repyy-scoop.json manifests/scoop/repyy.json
      - name: Update this package repository
        env:
          GH_TOKEN: ${{ secrets.REPYY_RELEASE_TOKEN }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python3 controller/scripts/publish-packages.py "$RELEASE_TAG" --target "$PACKAGE_TARGET" --directory manifests
