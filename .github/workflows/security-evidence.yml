name: Security evidence
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o /tmp/repyy ./cmd/repyy
      - run: python3 scripts/benchmark.py --binary /tmp/repyy --output /tmp/benchmark --check
      - name: Check bounded intelligence ingestion
        run: python3 -m unittest scripts/test_ingest_intelligence.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark
          path: /tmp/benchmark
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: scan, target: FuzzArchiveInspection }
          - { package: scan, target: FuzzArchivePaths }
          - { package: scan, target: FuzzGitMetadata }
          - { package: scan, target: FuzzSymlinkConfinement }
          - { package: config, target: FuzzConfiguration }
          - { package: manifest, target: FuzzManifests }
          - { package: output, target: FuzzHumanOutput }
          - { package: output, target: FuzzJSONReports }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz hostile input
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '120s' || '10s' }}
        run: go test "./internal/$FUZZ_PACKAGE" -run '^$' -fuzz "^${FUZZ_TARGET}$" -fuzztime
          "$FUZZ_TIME" -parallel 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore
