name: Bug report
description: Report reproducible incorrect behavior that is not security-sensitive
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private repository content, or live malware.
  - type: input
    id: version
    attributes:
      label: repyy version
      placeholder: Output of repyy version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Inert reproduction
      description: Provide minimal synthetic input and the exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
