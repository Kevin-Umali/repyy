name: False positive
description: Report a benign pattern that repyy flags
title: "false positive: "
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: Share the smallest inert example. Remove secrets and private source.
  - type: input
    id: rule
    attributes:
      label: Rule ID and version
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal benign example
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why this is benign and how the rule could distinguish it
    validations:
      required: true
