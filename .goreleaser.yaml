version: 2

builds:
  - id: repyy
    main: ./cmd/repyy
    binary: repyy
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X github.com/Kevin-Umali/repyy/internal/sandbox.ImageDigest={{.Env.REPYY_SANDBOX_IMAGE_DIGEST}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: repyy-packages
    package_name: repyy
    ids: [repyy]
    vendor: repyy contributors
    homepage: https://github.com/Kevin-Umali/repyy
    maintainer: Kevin <kevinumali0999@gmail.com>
    description: Offline-first malware and supply-chain scanner for source repositories
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin

homebrew_casks:
  - name: repyy
    repository:
      owner: Kevin-Umali
      name: homebrew-tap
      token: "{{ .Env.REPYY_RELEASE_TOKEN }}"
    homepage: https://github.com/Kevin-Umali/repyy
    description: Scan unfamiliar source repositories before running their code
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/repyy"]
          end

scoops:
  - name: repyy
    repository:
      owner: Kevin-Umali
      name: scoop-bucket
      token: "{{ .Env.REPYY_RELEASE_TOKEN }}"
    homepage: https://github.com/Kevin-Umali/repyy
    description: Scan unfamiliar source repositories before running their code
    license: MIT

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

changelog:
  sort: asc
