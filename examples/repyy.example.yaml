version: 1

rules:
  - id: LOCAL-001
    category: organization-policy
    severity: high
    confidence: high
    description: An unapproved bootstrap host is referenced
    pattern: 'bootstrap\.example\.invalid'
    globs:
      - '*.sh'
      - '*.ps1'
    match_scope: raw
    disposition: review
    rationale: Organization policy requires bootstrap hosts to be independently approved.
    legitimate_use: A reviewed internal bootstrap host may be expected for this repository.
    remediation: Verify the host with the assignment owner before running it.

suppressions:
  - fingerprint: sha256:replace-with-a-finding-fingerprint
    reason: Reviewed vendored test fixture
    expires: '2026-12-31'
